name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  BUN_VERSION: "1.4.4"
  RELEASE_BRANCH: changeset-release/main

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run package checks
        run: bun run check

      - name: Audit dependencies
        run: bun run audit

      - name: Detect pending changesets
        id: changesets
        shell: bash
        run: |
          shopt -s nullglob
          pending=()
          for file in .changeset/*.md; do
            if [[ "$(basename "${file}")" != "README.md" ]]; then
              pending+=("${file}")
            fi
          done
          if (( ${#pending[@]} > 0 )); then
            printf 'has_pending=true\n' >> "${GITHUB_OUTPUT}"
          else
            printf 'has_pending=false\n' >> "${GITHUB_OUTPUT}"
          fi

      - name: Version packages
        if: steps.changesets.outputs.has_pending == 'true'
        run: bun run version

      - name: Create or update release pull request
        if: steps.changesets.outputs.has_pending == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No version changes generated."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "${RELEASE_BRANCH}"
          git add .
          git commit -m "chore(release): version packages"
          git push origin "HEAD:${RELEASE_BRANCH}" --force

          title="chore(release): version packages"
          body="Version packages generated by Changesets."
          existing_pr="$(gh pr list --head "${RELEASE_BRANCH}" --base main --state open --json number --jq '.[0].number // empty')"
          if [[ -n "${existing_pr}" ]]; then
            gh pr edit "${existing_pr}" --title "${title}" --body "${body}"
          else
            gh pr create --base main --head "${RELEASE_BRANCH}" --title "${title}" --body "${body}"
          fi

      - name: Detect unpublished version
        id: published
        if: steps.changesets.outputs.has_pending == 'false'
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "@glyph-oss/contracts@${version}" version >/dev/null 2>&1; then
            printf 'is_published=true\n' >> "${GITHUB_OUTPUT}"
            echo "@glyph-oss/contracts@${version} is already published."
          else
            printf 'is_published=false\n' >> "${GITHUB_OUTPUT}"
            echo "@glyph-oss/contracts@${version} is not published yet."
          fi

      - name: Publish package and create GitHub release
        if: steps.changesets.outputs.has_pending == 'false' && steps.published.outputs.is_published == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          if [[ -z "${NPM_TOKEN}" ]]; then
            echo "NPM_TOKEN is not configured." >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm config set //registry.npmjs.org/:_authToken "${NPM_TOKEN}"

          bun run release
          git push --follow-tags

          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "GitHub Release ${tag} already exists. Leaving it unchanged."
          else
            gh release create "${tag}" --verify-tag --title "${tag}" --generate-notes
          fi
